[build]
publish = "."
functions = "netlify/functions"

[[redirects]]
from = "/api/lineups"
to = "/.netlify/functions/lineups"
status = 200

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/data/*"
[headers.values]
Cache-Control = "no-cache"
